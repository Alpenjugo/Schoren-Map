<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wichtelweg</title>
<meta name="robots" content="noindex">
<style>/*LEAFLET_CSS*/</style>
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,/*FONT*/) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --map:#f2ece3; --house:#e0d3c2; --house-none:#e9e0d4; --edge:#bfa98f;
  --street:#fffdf9; --street-edge:#dccdb9; --path:#b39f86;
  --ink:#3b2a1e; --muted:#76624f; --line:#eadfcf; --panel:#fffdf9;
  --brown:#4a3324;
  --red:#b4532a; --red-dark:#8a3a17; --red-soft:#f6e4d6;
  --blue:#2b6fdc; --focus:#2b6fdc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);background:var(--map);
  font:15px/1.5 "Bricolage",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:var(--map)}

/* ---------- Seitenleiste ---------- */
.pill{position:fixed;z-index:1001;left:16px;top:16px;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 12px;
  background:var(--panel);border:0;border-radius:999px;box-shadow:0 4px 16px rgba(74,51,36,.18);cursor:pointer;text-align:left;color:var(--brown)}
.pill:hover{background:#fbf6ef}
.burger{width:36px;height:36px;border-radius:50%;background:var(--brown);color:#fffdf9;display:grid;place-items:center;flex:none}
.pill b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pill small{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.pill small:empty{display:none}
.pill.edit small{color:var(--red-dark);font-weight:700}
.panel{position:fixed;z-index:1002;left:16px;top:16px;bottom:16px;width:340px;background:var(--panel);
  border-radius:18px;box-shadow:0 10px 40px rgba(74,51,36,.2),0 1px 3px rgba(74,51,36,.08);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(-100% - 24px));visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.panel.open{transform:none;visibility:visible;transition:transform .25s ease}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:#f3ebe0;color:var(--brown);cursor:pointer;font-size:18px;line-height:1}
.close:hover{background:#eadfcf}
.brand .when{margin:6px 0 0;color:var(--brown);font-weight:650}
.brand .when:empty,.brand p:empty{display:none}
.when-edit{margin-top:10px}
.when-edit label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:4px}
.when-edit .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.when-edit input{width:100%;flex:1 1 100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.when-edit small{display:block;font-size:12.5px;color:var(--muted);min-height:1em;margin-top:3px}
.panel-scroll{overflow-y:auto;padding:24px 22px 16px;display:flex;flex-direction:column;gap:20px;flex:1}
.brand h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.035em;margin:0;color:var(--brown);padding-right:40px}
.brand p{margin:8px 0 0;color:var(--muted)}
.brand p strong{color:var(--red);font-weight:750}

.adminbar{background:var(--red-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.adminbar b{display:block;font-size:15px}
.adminbar .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.adminbar .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.search{position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:12px;background:#f8f3ec}
.search input:focus{background:#fff}
.search svg{position:absolute;left:13px;top:13px;color:var(--muted)}
.hits{list-style:none;margin:6px 0 0;padding:0}
.hits:empty{display:none}
.hits button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.hits button:hover{background:#f3ebe0}
.tag{font-size:12px;color:var(--red);font-weight:700}

details.list summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px}
details.list summary::-webkit-details-marker{display:none}
details.list summary .count{color:var(--muted);font-weight:500;font-size:14px}
details.list summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:10px;align-self:center}
details.list[open] summary::after{transform:rotate(-135deg) translate(-3px,-3px)}
.street{margin-top:14px}
.street h3{font-size:13px;font-weight:650;color:var(--muted);margin:0 0 4px}
.street ul{list-style:none;margin:0;padding:0}
.street li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f1e9de}
.street li:last-child{border-bottom:0}
.pin{width:10px;height:10px;border-radius:3px;background:var(--red);margin-top:7px;flex:none}
.entry{flex:1;min-width:0}
.entry button.go{background:none;border:0;padding:0;cursor:pointer;font-weight:650;text-align:left}
.entry button.go:hover{text-decoration:underline;text-underline-offset:3px}
.entry .hint{color:var(--muted);font-size:13.5px;margin-top:1px}
.entry .out{font-size:12px;color:var(--muted)}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:8px;flex:none}
.rm:hover{background:var(--red-soft);color:var(--red)}
.empty{color:var(--muted);font-size:14px;margin:10px 0 0}
.note{font-size:13px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#cdb9a0}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
footer.src{padding:12px 22px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
footer.src p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.35}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--red-dark)}

/* ---------- Karte ---------- */
.leaflet-container{font-family:inherit;background:var(--map)}
.leaflet-bar a{background:var(--panel)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel)}
.leaflet-bar{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:0 4px 16px rgba(74,51,36,.16)!important}
.leaflet-bar a{color:var(--ink)}
.mapbtn{width:44px;height:44px;border-radius:12px;background:var(--panel);box-shadow:0 4px 16px rgba(74,51,36,.16);display:grid;place-items:center;cursor:pointer;border:0;color:var(--ink);text-decoration:none}
.mapbtn:hover{background:#f3ebe0}
.mapbtn.on{color:var(--blue)}
.north-arrow{position:relative;width:44px;height:44px;background:var(--panel);border-radius:50%;box-shadow:0 4px 16px rgba(74,51,36,.16);display:grid;place-items:center}
.north-arrow span{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:11px;color:var(--ink);line-height:1}
.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;font-size:11px}

path.bld{transition:fill .3s ease}
path.bld.on{filter:drop-shadow(0 0 5px rgba(180,83,42,.55)) drop-shadow(0 2px 8px rgba(180,83,42,.35))}

.hn-b{pointer-events:none}
.hn-b span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;display:none;
  font-size:13px;font-weight:700;color:#8a7663;line-height:1}
.hn-b.on span{color:#fff;font-weight:800;display:none}
.show-hnr .hn-b.on span{display:block}
.hn-b span.rand{font-style:italic}
.show-hnb .hn-b:not(.on) span{display:block}
.hn-l .hn-b span{font-size:16px}
.hn-xl .hn-b span{font-size:20px}
.leaflet-tooltip.hn{display:none;background:rgba(255,253,249,.9);border:0;box-shadow:none;padding:0 4px;font-size:11px;font-weight:700;color:#8a7663;border-radius:4px}
.leaflet-tooltip.hn::before{display:none}
.show-hn .leaflet-tooltip.hn{display:block}

.st-lbl{pointer-events:none}
.st-lbl span{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:600;color:#76624f;letter-spacing:.03em;
  text-shadow:0 0 2px #fffdf9,0 0 3px #fffdf9,0 0 4px #fffdf9;display:none}
.show-sl .st-lbl span.sl,.show-wl .st-lbl span.wl{display:block}
.st-lbl span.wl{font-weight:500;font-style:italic;font-size:11px;color:#94816d}

.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 10px 30px rgba(74,51,36,.22)}
.leaflet-popup-content{margin:12px 16px 12px 14px;font-size:15px;min-width:200px}
.pp + .pp{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.pp-title{font-weight:700}
.pp-hint{color:var(--muted);margin-top:2px}
.pp-out{font-size:12.5px;color:var(--muted)}
.pp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-right:12px}
.toggle{border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--red);color:#fff;white-space:nowrap}
.toggle.on{background:var(--panel);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.toggle:disabled{opacity:.5;cursor:wait}
.pp-edit{margin-top:6px}
.pp-edit input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.pp-edit small{color:var(--muted);font-size:12px}

/* Login */
dialog{border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(74,51,36,.3);width:min(360px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(74,51,36,.35)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0;font-size:22px;letter-spacing:-.01em}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
dialog input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:400}
dialog .err{color:var(--red-dark);font-size:14px;margin:0}
dialog .row{display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;z-index:2000;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast.err{background:var(--red-dark)}

@media (max-width:760px){
  .pill{left:10px;top:10px}
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:70vh;border-radius:16px;transform:translateY(calc(100% + 16px))}
  .panel-scroll{padding:16px 16px 12px;gap:14px}
  .brand h1{font-size:30px}
  footer.src{padding:10px 16px 12px}
}
@media (prefers-reduced-motion:reduce){path.bld,.panel,.panel.open{transition:none}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Karte des Wichtelwegs"></div>

<button class="pill" id="pill" aria-controls="panel" aria-expanded="false">
  <span class="burger" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
  <span><b id="pill-title">Wichtelweg</b><small id="pill-sub"></small></span>
</button>

<aside class="panel" id="panel" aria-label="Wichtelweg" aria-hidden="true">
  <button class="close" id="btn-close" aria-label="Menü schliessen">✕</button>
  <div class="panel-scroll">
    <header class="brand">
      <h1 id="title">Wichtelweg</h1>
      <p class="when" id="when"></p>
      <div class="when-edit" id="when-edit" hidden>
        <label for="title-input">Titel</label>
        <input type="text" id="title-input" maxlength="40" placeholder="Wichtelweg">
        <label for="when-input" style="margin-top:8px">Text unter dem Titel</label>
        <div class="row"><input type="text" id="when-input" maxlength="120" placeholder="1. bis 24. Dezember, täglich ab 17 Uhr"><button class="btn" id="when-save">Speichern</button></div>
        <small id="when-info"></small>
      </div>
      <p id="summary"></p>
    </header>

    <div class="adminbar" id="adminbar" hidden>
      <b>Bearbeitungsmodus</b>
      Tippe auf ein Haus, um es hinzuzufügen oder zu entfernen.
      <div class="row"><span class="who" id="who"></span><button class="btn" id="btn-logout">Abmelden</button></div>
    </div>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Adresse suchen" autocomplete="off" aria-label="Adresse suchen">
      <ul class="hits" id="hits"></ul>
    </div>

    <details class="list" id="list">
      <summary>Teilnehmende Häuser <span class="count" id="count"></span></summary>
      <div id="streets"></div>
      <p class="empty" id="list-empty" hidden></p>
    </details>

    <div id="admin-tools" hidden>
      <button class="btn" id="btn-csv">Liste für Excel herunterladen</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
  <footer class="src">
    <p>Karte: © swisstopo (Adressen, Strassen 2026; Gebäude 2022)</p>
    <button class="linkbtn" id="btn-login">Anmelden (Organisation)</button>
  </footer>
</aside>

<dialog id="login">
  <form id="login-form" method="dialog">
    <h2>Anmelden</h2>
    <label>E-Mail <input type="email" id="login-email" autocomplete="username" required></label>
    <label>Passwort <input type="password" id="login-pw" autocomplete="current-password" required></label>
    <p class="err" id="login-err" hidden></p>
    <div class="row"><button type="button" class="btn" id="login-cancel">Abbrechen</button><button class="btn primary" id="login-go">Anmelden</button></div>
  </form>
</dialog>

<script>/*LEAFLET_JS*/</script>
<script src="config.js"></script>
<script>
const ADDR = /*ADDR*/;
const GRENZE = /*GRENZE*/;
const STREETS = /*STREETS*/;
const BUILDINGS = /*BUILDINGS*/;
const BEARING = 225; // Paul-Brandt- und Sonnenbergstrasse waagrecht, Schäflerstrasse unten

const CFG = window.WICHTELWEG_CONFIG || {};
const API = (CFG.supabaseUrl && CFG.supabaseKey) ? CFG.supabaseUrl.replace(/\/+$/, '') : null;
const DEMO = !API;
const SESSION_KEY = 'wichtelweg-session';
const DEMO_KEY = 'wichtelweg-demo-daten';

const byId = new Map(ADDR.map(a => [a.id, a]));
const byEgid = new Map();
ADDR.forEach(a => { if (!byEgid.has(a.egid)) byEgid.set(a.egid, []); byEgid.get(a.egid).push(a); });
const coll = new Intl.Collator('de-CH', {numeric: true, sensitivity: 'base'});
const label = a => `${a.str} ${a.nr}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- Datenzugriff (Supabase REST, im Demo-Modus Browser-Speicher) ---------- */
const db = {
  session: store.get(SESSION_KEY),
  headers(withUser) {
    const h = {apikey: CFG.supabaseKey, 'Content-Type': 'application/json'};
    if (withUser && this.session) h.Authorization = 'Bearer ' + this.session.access_token;
    return h;
  },
  async list() {
    if (DEMO) return store.get(DEMO_KEY) || [];
    const r = await fetch(`${API}/rest/v1/teilnehmer?select=egaid,hinweis`, {headers: this.headers(false), cache: 'no-store'});
    if (!r.ok) throw new Error('Laden fehlgeschlagen (' + r.status + ')');
    return r.json();
  },
  async login(email, password) {
    if (DEMO) { this.session = {demo: true, email, access_token: 'demo', expires_at: Date.now() / 1000 + 86400}; store.set(SESSION_KEY, this.session); return; }
    const r = await fetch(`${API}/auth/v1/token?grant_type=password`, {method: 'POST', headers: this.headers(false), body: JSON.stringify({email, password})});
    if (!r.ok) throw new Error(r.status === 400 ? 'E-Mail oder Passwort stimmt nicht.' : 'Anmeldung nicht möglich. Versuche es später noch einmal.');
    this.setSession(await r.json());
  },
  setSession(j) {
    this.session = {access_token: j.access_token, refresh_token: j.refresh_token, email: j.user && j.user.email,
      expires_at: j.expires_at || (Date.now() / 1000 + (j.expires_in || 3600))};
    store.set(SESSION_KEY, this.session);
  },
  async fresh() {
    if (DEMO || !this.session) return;
    if (this.session.expires_at - Date.now() / 1000 > 60) return;
    const r = await fetch(`${API}/auth/v1/token?grant_type=refresh_token`, {method: 'POST', headers: this.headers(false), body: JSON.stringify({refresh_token: this.session.refresh_token})});
    if (!r.ok) { this.logout(); throw new Error('Anmeldung abgelaufen. Melde dich neu an.'); }
    const email = this.session.email; this.setSession(await r.json());
    if (!this.session.email) { this.session.email = email; store.set(SESSION_KEY, this.session); }
  },
  async write(method, query, body) {
    await this.fresh();
    const r = await fetch(`${API}/rest/v1/${query}`, {method, body: body && JSON.stringify(body),
      headers: {...this.headers(true), Prefer: 'resolution=merge-duplicates,return=minimal'}});
    if (r.status === 401) { this.logout(); throw new Error('Anmeldung abgelaufen. Melde dich neu an.'); }
    if (!r.ok) { const e = new Error('Änderung nicht gespeichert. Versuche es noch einmal.'); e.status = r.status; throw e; }
  },
  async upsert(egaid, hinweis) {
    if (DEMO) { const l = (store.get(DEMO_KEY) || []).filter(x => x.egaid !== egaid); l.push({egaid, hinweis}); store.set(DEMO_KEY, l); return; }
    await this.write('POST', 'teilnehmer?on_conflict=egaid', [{egaid, hinweis}]);
  },
  async remove(egaid) {
    if (DEMO) { store.set(DEMO_KEY, (store.get(DEMO_KEY) || []).filter(x => x.egaid !== egaid)); return; }
    await this.write('DELETE', `teilnehmer?egaid=eq.${encodeURIComponent(egaid)}`);
  },
  async settings() {
    if (DEMO) return store.get(DEMO_KEY + '-einstellungen') || {};
    const r = await fetch(`${API}/rest/v1/einstellungen?select=schluessel,wert`, {headers: this.headers(false), cache: 'no-store'});
    if (!r.ok) throw new Error('Einstellungen nicht geladen (' + r.status + ')');
    const o = {}; (await r.json()).forEach(x => { o[x.schluessel] = x.wert; }); return o;
  },
  async setSettings(obj) {
    if (DEMO) { store.set(DEMO_KEY + '-einstellungen', {...(store.get(DEMO_KEY + '-einstellungen') || {}), ...obj}); return; }
    await this.write('POST', 'einstellungen?on_conflict=schluessel', Object.entries(obj).map(([schluessel, wert]) => ({schluessel, wert})));
  },
  logout() {
    if (!DEMO && this.session) fetch(`${API}/auth/v1/logout`, {method: 'POST', headers: this.headers(true)}).catch(() => {});
    this.session = null; store.del(SESSION_KEY);
  }
};

/* ---------- Zustand ---------- */
const part = new Map();          // EGAID -> Hinweis
let loaded = false;
const isAdmin = () => !!db.session;
const isOn = id => part.has(id);

/* ---------- Karte ---------- */
const map = L.map('map', {zoomControl: false, maxZoom: 20, zoomSnap: 0, zoomDelta: 0.5, bounceAtZoomLimits: false, rotate: true, bearing: 0,
  rotateControl: false, touchRotate: false, shiftKeyRotate: false, pitchDrag: false, attributionControl: true});
map.attributionControl.setPrefix(false);
L.control.zoom({position: 'topright'}).addTo(map);

const NorthArrow = L.Control.extend({options: {position: 'topright'}, onAdd() {
  const d = L.DomUtil.create('div', 'north-arrow'); d.title = 'Norden'; d.setAttribute('aria-hidden', 'true');
  d.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><g class="na-rot"><polygon points="20,5 25.5,21 20,18.5 14.5,21" fill="#b4532a"/><polygon points="20,35 25.5,21 20,23.5 14.5,21" fill="#cdb9a0"/></g></svg><span>N</span>';
  return d; }});
new NorthArrow().addTo(map);
function updateArrow() {
  const b = map.getBearing(), el = document.querySelector('.north-arrow'); if (!el) return;
  el.querySelector('.na-rot').setAttribute('transform', `rotate(${b} 20 20)`);
  const rad = b * Math.PI / 180, s = el.querySelector('span');
  s.style.left = (21 + 16 * Math.sin(rad)) + 'px'; s.style.top = (21 - 16 * Math.cos(rad)) + 'px';
}
map.on('rotate', updateArrow);

/* Mein Standort */
let watchId = null, meDot = null, meAcc = null, firstFix = false;
const LocateBtn = L.Control.extend({options: {position: 'topright'}, onAdd() {
  const b = L.DomUtil.create('button', 'mapbtn'); b.id = 'btn-locate'; b.type = 'button';
  b.title = 'Mein Standort'; b.setAttribute('aria-label', 'Mein Standort anzeigen');
  b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
  L.DomEvent.disableClickPropagation(b); b.onclick = toggleLocate; return b; }});
new LocateBtn().addTo(map);
function toggleLocate() {
  const btn = document.getElementById('btn-locate');
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId); watchId = null; btn.classList.remove('on');
    if (meDot) { map.removeLayer(meDot); map.removeLayer(meAcc); meDot = meAcc = null; } return;
  }
  if (!navigator.geolocation) { toast('Dieses Gerät kann den Standort nicht bestimmen.', true); return; }
  btn.classList.add('on'); firstFix = true;
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!meDot) {
      meAcc = L.circle(ll, {radius: p.coords.accuracy, color: '#2b6fdc', weight: 1, fillOpacity: .1, interactive: false}).addTo(map);
      meDot = L.circleMarker(ll, {radius: 8, color: '#fff', weight: 3, fillColor: '#2b6fdc', fillOpacity: 1, interactive: false}).addTo(map);
    } else { meDot.setLatLng(ll); meAcc.setLatLng(ll).setRadius(p.coords.accuracy); }
    if (firstFix) { firstFix = false; map.setView(ll, Math.max(map.getZoom(), 18)); }
  }, err => {
    toast(err.code === 1 ? 'Standort nicht freigegeben. Erlaube den Zugriff in den Browser-Einstellungen.' : 'Standort nicht gefunden. Versuche es draussen noch einmal.', true);
    if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; btn.classList.remove('on');
  }, {enableHighAccuracy: true, maximumAge: 10000});
}

/* Vollbild, nur wenn die Karte in einer anderen Seite eingebettet ist */
let embedded = false; try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
if (embedded) {
  const FullBtn = L.Control.extend({options: {position: 'topright'}, onAdd() {
    const a = L.DomUtil.create('a', 'mapbtn'); a.href = location.href.split('#')[0]; a.target = '_blank'; a.rel = 'noopener';
    a.title = 'Karte im Vollbild öffnen'; a.setAttribute('aria-label', 'Karte im Vollbild öffnen');
    a.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    return a; }});
  new FullBtn().addTo(map);
}

map.createPane('strassen', map.getPane('rotatePane')).style.zIndex = 340;
map.createPane('gebaeude', map.getPane('rotatePane')).style.zIndex = 350;
map.createPane('beschriftung', map.getPane('norotatePane')).style.zIndex = 380;
map.getPane('beschriftung').style.pointerEvents = 'none';

/* Strassen */
const isPath = n => /(weg|treppe)$/i.test(n);
STREETS.forEach(s => {
  s.lines.forEach(line => {
    if (isPath(s.name)) L.polyline(line, {pane: 'strassen', color: '#b39f86', weight: 2, dashArray: '5 4', interactive: false}).addTo(map);
    else {
      L.polyline(line, {pane: 'strassen', color: '#dccdb9', weight: 11, lineCap: 'round', lineJoin: 'round', interactive: false}).addTo(map);
      L.polyline(line, {pane: 'strassen', color: '#fffdf9', weight: 8, lineCap: 'round', lineJoin: 'round', interactive: false}).addTo(map);
    }
  });
  s.labels.forEach(([lat, lng, ang]) => L.marker([lat, lng], {pane: 'beschriftung', interactive: false, keyboard: false,
    icon: L.divIcon({className: 'st-lbl', iconSize: [0, 0], html: `<span class="${isPath(s.name) ? 'wl' : 'sl'}" data-ang="${ang}">${esc(s.name)}</span>`})}).addTo(map));
});
function updateStreetLabels() {
  const b = map.getBearing();
  document.querySelectorAll('.st-lbl span').forEach(s => {
    let a = Number(s.dataset.ang) + b; a = ((a + 90) % 180 + 180) % 180 - 90;
    s.style.transform = `translate(-50%,-50%) rotate(${a}deg)`;
  });
}

/* Gebäude */
const FP = new Set(BUILDINGS.map(b => b.egid));
const blds = [];               // {b, adr, poly, lbl}
const bldByEgid = new Map();
const fillOf = o => o.adr.some(a => isOn(a.id)) ? '#b4532a' : o.adr.length ? '#e0d3c2' : '#e9e0d4';
BUILDINGS.forEach(b => {
  const adr = (b.egid && byEgid.get(b.egid)) || [];
  const o = {b, adr};
  o.poly = L.polygon(b.rings, {pane: 'gebaeude', className: 'bld', color: '#bfa98f', weight: 1, fillColor: '#e9e0d4', fillOpacity: 1}).addTo(map);
  o.poly.on('click', e => openBuilding(o, e.latlng));
  o.poly.on('mouseover', () => { if (o.adr.length && !o.adr.some(a => isOn(a.id)) && isAdmin()) o.poly.setStyle({fillColor: '#d5c3ac'}); });
  o.poly.on('mouseout', () => o.poly.setStyle({fillColor: fillOf(o)}));
  const nrs = adr.filter(a => !a.neben).sort((x, y) => coll.compare(x.nr, y.nr));
  if (nrs.length && b.lp) {
    const rand = nrs.every(a => a.zone === 'rand');
    o.lbl = L.marker(b.lp, {pane: 'beschriftung', interactive: false, keyboard: false,
      icon: L.divIcon({className: 'hn-b', iconSize: [0, 0], html: `<span class="${rand ? 'rand' : ''}">${nrs.map(a => esc(a.nr)).join('/')}</span>`})}).addTo(map);
  }
  o.nrs = nrs; o.rand = nrs.length && nrs.every(a => a.zone === 'rand');
  blds.push(o); if (b.egid) bldByEgid.set(b.egid, o);
});
/* In der Übersicht (wenig Zoom) markiert ein roter Punkt die teilnehmenden Häuser */
const pinLayer = L.layerGroup().addTo(map);

/* Adressen ohne Gebäudeumriss (z. B. Nebengebäude) als Punkt */
const dots = new Map();
const dotLayer = L.layerGroup().addTo(map);
ADDR.filter(a => a.neben || !FP.has(a.egid)).forEach(a => {
  const m = L.circleMarker([a.lat, a.lng], {radius: 6, color: '#fff', weight: 2, fillColor: '#9c8670', fillOpacity: 1});
  m.bindTooltip(esc(a.nr), {permanent: true, direction: 'right', offset: [6, 0], className: 'hn'});
  m.on('click', () => openAddrs([a], m.getLatLng()));
  dots.set(a.id, m);
});

/* Popups */
const popup = L.popup({minWidth: 220, maxWidth: 300, autoPanPaddingTopLeft: [20, 80]});
let popupAdrs = null;
function openBuilding(o, ll) {
  const list = isAdmin() ? o.adr : o.adr.filter(a => isOn(a.id));
  if (!list.length) { if (isAdmin()) openAddrs([], ll, 'Gebäude ohne Adresse'); return; }
  openAddrs(list, o.b.lp || ll);
}
function openAddrs(list, ll, emptyText) {
  popupAdrs = {list: [...list].sort((x, y) => coll.compare(label(x), label(y))), emptyText};
  popup.setLatLng(ll).setContent(popupHtml()).openOn(map);
}
function popupHtml() {
  const {list, emptyText} = popupAdrs;
  if (!list.length) return `<div class="pp-hint">${esc(emptyText || '')}</div>`;
  return list.map(a => {
    const on = isOn(a.id), out = a.zone === 'rand' ? '<div class="pp-out">knapp ausserhalb des Quartiers</div>' : '';
    if (!isAdmin()) return `<div class="pp"><div class="pp-title">${esc(label(a))}</div>${part.get(a.id) ? `<div class="pp-hint">${esc(part.get(a.id))}</div>` : ''}</div>`;
    return `<div class="pp"><div class="pp-row"><div><div class="pp-title">${esc(label(a))}</div>${out}</div>`
      + `<button class="toggle${on ? ' on' : ''}" data-toggle="${a.id}">${on ? 'Entfernen' : 'Hinzufügen'}</button></div>`
      + (on ? `<div class="pp-edit"><input type="text" maxlength="200" placeholder="Hinweis, z. B. Fenster links" data-hint="${a.id}" value="${esc(part.get(a.id) || '')}" aria-label="Hinweis zu ${esc(label(a))}"><small data-saved="${a.id}"></small></div>` : '')
      + `</div>`;
  }).join('');
}
function refreshPopup() { if (popup.isOpen() && popupAdrs) popup.setContent(popupHtml()); }

document.getElementById('map').addEventListener('click', async e => {
  const b = e.target.closest('[data-toggle]'); if (!b || !isAdmin()) return;
  const id = Number(b.dataset.toggle); b.disabled = true;
  try {
    if (isOn(id)) { await db.remove(id); part.delete(id); }
    else { await db.upsert(id, ''); part.set(id, ''); }
  } catch (err) { toast(err.message, true); if (!isAdmin()) renderAdmin(); }
  renderAll(); refreshPopup();
  const inp = document.querySelector(`[data-hint="${id}"]`); if (inp) inp.focus();
});
document.getElementById('map').addEventListener('change', async e => {
  const inp = e.target.closest('[data-hint]'); if (!inp || !isAdmin()) return;
  const id = Number(inp.dataset.hint), val = inp.value.trim().slice(0, 200), info = document.querySelector(`[data-saved="${id}"]`);
  try { await db.upsert(id, val); part.set(id, val); if (info) info.textContent = 'Gespeichert'; renderList(); }
  catch (err) { toast(err.message, true); if (!isAdmin()) renderAdmin(); }
});
document.getElementById('map').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-hint]')) e.target.blur(); });

/* Darstellung */
function renderMap() {
  blds.forEach(o => {
    const on = o.adr.some(a => isOn(a.id));
    o.poly.setStyle({fillColor: fillOf(o), color: on ? '#7a3415' : '#bfa98f'});
    if (o.poly._path) o.poly._path.classList.toggle('on', on);
    const el = o.lbl && o.lbl.getElement();
    if (el) {
      el.classList.toggle('on', on);
      const shown = on ? o.nrs.filter(a => isOn(a.id)) : o.nrs;
      el.firstChild.textContent = shown.map(a => a.nr).join('/');
    }
  });
  pinLayer.clearLayers();
  blds.forEach(o => { if (o.b.lp && o.adr.some(a => isOn(a.id)))
    pinLayer.addLayer(L.circleMarker(o.b.lp, {radius: 7, color: '#fffdf9', weight: 2.5, fillColor: '#b4532a', fillOpacity: 1, interactive: true})
      .on('click', e => openBuilding(o, e.latlng))); });
  dotLayer.clearLayers();
  dots.forEach((m, id) => {
    const on = isOn(id);
    if (!on && !isAdmin()) return;
    m.setStyle(on ? {radius: 9, fillColor: '#b4532a', color: '#fffdf9', weight: 3} : {radius: 6, fillColor: '#9c8670', color: '#fffdf9', weight: 2});
    dotLayer.addLayer(m);
  });
}
function updateZoomClasses() {
  const z = map.getZoom(), c = map.getContainer();
  c.classList.toggle('show-hn', z >= 18); c.classList.toggle('show-hnb', z >= 18.5); c.classList.toggle('show-hnr', z >= 17.5);
  if (z >= 17.5) map.removeLayer(pinLayer); else if (!map.hasLayer(pinLayer)) pinLayer.addTo(map);
  c.classList.toggle('hn-l', z >= 19); c.classList.toggle('hn-xl', z >= 19.75);
  c.classList.toggle('show-sl', z >= 17); c.classList.toggle('show-wl', z >= 18);
}

/* Liste der teilnehmenden Häuser, nach Strasse gruppiert */
function renderList() {
  const items = [...part.keys()].map(id => byId.get(id) || {id, str: 'Unbekannte Adresse', nr: String(id), missing: true})
    .sort((x, y) => coll.compare(label(x), label(y)));
  const n = items.length;
  document.getElementById('count').textContent = loaded && isAdmin() ? String(n) : '';
  if (loaded) document.getElementById('summary').textContent = isAdmin() ? ''
    : n ? 'Tippe auf ein markiertes Haus für Details.' : 'Die Häuser werden bald eingetragen. Schau später wieder vorbei.';
  renderPill(n);
  const empty = document.getElementById('list-empty');
  empty.hidden = n > 0; empty.textContent = isAdmin() ? 'Tippe auf ein Haus in der Karte, um es hinzuzufügen.' : 'Noch keine Häuser eingetragen.';
  const box = document.getElementById('streets'); box.innerHTML = '';
  let cur = null, ul = null;
  items.forEach(a => {
    if (a.str !== cur) {
      cur = a.str; const sec = document.createElement('div'); sec.className = 'street';
      const h = document.createElement('h3'); h.textContent = a.str; ul = document.createElement('ul'); sec.append(h, ul); box.append(sec);
    }
    const li = document.createElement('li');
    const pin = document.createElement('span'); pin.className = 'pin';
    const ent = document.createElement('div'); ent.className = 'entry';
    const go = document.createElement('button'); go.className = 'go'; go.textContent = a.missing ? `Adresse ${a.id}` : `${a.str} ${a.nr}`;
    if (!a.missing) go.onclick = () => focusAddr(a.id);
    ent.append(go);
    const hint = part.get(a.id);
    if (hint) { const d = document.createElement('div'); d.className = 'hint'; d.textContent = hint; ent.append(d); }
    if (a.zone === 'rand') { const d = document.createElement('div'); d.className = 'out'; d.textContent = 'knapp ausserhalb des Quartiers'; ent.append(d); }
    if (a.missing) { const d = document.createElement('div'); d.className = 'out'; d.textContent = 'Nicht im Adressverzeichnis gefunden'; ent.append(d); }
    li.append(pin, ent);
    if (isAdmin()) {
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕';
      rm.setAttribute('aria-label', `${go.textContent} entfernen`); rm.title = 'Entfernen';
      rm.onclick = async () => { try { await db.remove(a.id); part.delete(a.id); } catch (err) { toast(err.message, true); if (!isAdmin()) renderAdmin(); } renderAll(); refreshPopup(); };
      li.append(rm);
    }
    ul.append(li);
  });
}
function renderAll() { renderMap(); renderList(); }

function focusAddr(id) {
  const a = byId.get(id); if (!a) return;
  const o = !a.neben && bldByEgid.get(a.egid);
  const ll = o && o.b.lp ? o.b.lp : [a.lat, a.lng];
  map.setView(ll, Math.max(map.getZoom(), 18.5));
  if (o) openBuilding(o, ll);
  else if (isAdmin() || isOn(id)) openAddrs([a], ll);
  if (window.innerWidth <= 760) setMenu(false);
}

/* Suche */
const search = document.getElementById('search');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase().replace(/\s+/g, ' ');
  const hits = document.getElementById('hits'); hits.innerHTML = '';
  if (q.length < 2) return;
  ADDR.filter(a => label(a).toLowerCase().includes(q) && (!a.neben || isAdmin() || isOn(a.id)))
    .sort((x, y) => (isOn(y.id) - isOn(x.id)) || coll.compare(label(x), label(y))).slice(0, 8)
    .forEach(a => {
      const li = document.createElement('li'), b = document.createElement('button');
      b.innerHTML = `<span>${esc(label(a))}</span>${isOn(a.id) ? '<span class="tag">macht mit</span>' : ''}`;
      b.onclick = () => { focusAddr(a.id); search.value = ''; hits.innerHTML = ''; };
      li.append(b); hits.append(li);
    });
  if (!hits.children.length) hits.innerHTML = '<li class="note" style="padding:6px 10px">Keine Adresse gefunden.</li>';
});

/* Menü öffnen und schliessen */
const panel = document.getElementById('panel'), pill = document.getElementById('pill');
function setMenu(open) {
  panel.classList.toggle('open', open); panel.setAttribute('aria-hidden', String(!open));
  pill.setAttribute('aria-expanded', String(open)); pill.hidden = open;
  if (open) document.getElementById('btn-close').focus(); else pill.focus({preventScroll: true});
}
pill.onclick = () => setMenu(true);
document.getElementById('btn-close').onclick = () => setMenu(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open') && !dlg.open) setMenu(false); });
map.on('click', () => { if (panel.classList.contains('open') && window.innerWidth <= 760) setMenu(false); });
function renderPill(n) {
  const sub = document.getElementById('pill-sub');
  if (!loaded && !isAdmin()) return;
  pill.classList.toggle('edit', isAdmin());
  sub.textContent = isAdmin() ? 'Bearbeiten' : '';
}
let zeitraum = CFG.zeitraum || '', titel = CFG.titel || 'Wichtelweg';
function renderWhen() {
  const show = titel || 'Wichtelweg';
  document.getElementById('title').textContent = show;
  document.getElementById('pill-title').textContent = show;
  document.title = show;
  document.getElementById('when').textContent = isAdmin() ? '' : zeitraum;
  document.getElementById('when-edit').hidden = !isAdmin();
  const ti = document.getElementById('title-input'), wi = document.getElementById('when-input');
  if (document.activeElement !== ti) ti.value = titel;
  if (document.activeElement !== wi) wi.value = zeitraum;
}
async function saveWhen() {
  const info = document.getElementById('when-info');
  const t = document.getElementById('title-input').value.trim().slice(0, 40) || 'Wichtelweg';
  const z = document.getElementById('when-input').value.trim().slice(0, 120);
  try { await db.setSettings({titel: t, zeitraum: z}); titel = t; zeitraum = z; info.textContent = 'Gespeichert'; renderWhen(); }
  catch (err) { info.textContent = ''; toast([403, 404].includes(err.status) ? 'Nicht gespeichert. In Supabase fehlt noch die aktuelle Ergänzung «Einstellungen» (siehe Anleitung).' : err.message, true); if (!isAdmin()) renderAdmin(); }
}
document.getElementById('when-save').onclick = saveWhen;
['title-input', 'when-input'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveWhen(); } });
  el.addEventListener('input', () => { document.getElementById('when-info').textContent = ''; });
});

/* Meldungen */
let toastTimer = null;
function toast(msg, err) {
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'alert'); document.body.append(t); }
  t.textContent = msg; t.classList.toggle('err', !!err); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

/* Anmeldung */
const dlg = document.getElementById('login');
document.getElementById('btn-login').onclick = () => {
  if (isAdmin()) return;
  document.getElementById('login-err').hidden = true; dlg.showModal(); document.getElementById('login-email').focus();
};
document.getElementById('login-cancel').onclick = () => dlg.close();
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('login-err'), go = document.getElementById('login-go');
  go.disabled = true; err.hidden = true;
  try {
    await db.login(document.getElementById('login-email').value.trim(), document.getElementById('login-pw').value);
    document.getElementById('login-pw').value = ''; dlg.close(); renderAdmin(); renderAll(); refreshPopup();
    toast(DEMO ? 'Angemeldet im Demo-Modus.' : 'Angemeldet.');
  } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  go.disabled = false;
});
document.getElementById('btn-logout').onclick = () => { db.logout(); renderAdmin(); renderAll(); map.closePopup(); toast('Abgemeldet.'); };
function renderAdmin() {
  const on = isAdmin();
  document.getElementById('adminbar').hidden = !on;
  document.getElementById('admin-tools').hidden = !on;
  document.getElementById('btn-login').hidden = on;
  document.getElementById('who').textContent = on ? (db.session.email || '') + (DEMO ? ' (Demo)' : '') : '';
  if (on) document.getElementById('list').open = true;
  renderWhen();
}

/* CSV für die Verwaltung */
document.getElementById('btn-csv').onclick = () => {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['Strasse', 'Nr', 'Hinweis', 'Ausserhalb', 'EGAID'].map(q).join(';')];
  [...part.keys()].map(id => byId.get(id)).filter(Boolean).sort((x, y) => coll.compare(label(x), label(y)))
    .forEach(a => rows.push([a.str, a.nr, part.get(a.id) || '', a.zone === 'rand' ? 'ja' : '', a.id].map(q).join(';')));
  const blob = new Blob(['﻿' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = `wichtelweg-haeuser-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* Ansicht einpassen: Quartier zentriert, Seitenleiste berücksichtigt */
function fitQuartier() {
  map.fitBounds(L.latLngBounds(GRENZE), {animate: false});
  map.setBearing(BEARING);
  const pts = GRENZE.map(ll => map.latLngToContainerPoint(ll)), size = map.getSize();
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const mobile = window.innerWidth <= 760;
  const padL = 0, padB = 0, padT = mobile ? 64 : 72;
  const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  const scale = Math.min((size.x - (mobile ? 16 : 80)) / w, (size.y - padT - 24) / h);
  const z = Math.min(map.getZoom() + Math.log2(scale), 19);
  const mid = map.containerPointToLatLng(L.point((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2));
  const fz = Math.floor(z * 4) / 4;
  map.setMinZoom(fz - 0.75);
  map.setView(mid, fz, {animate: false});
  map.panBy([0, -padT / 2], {animate: false});
}

/* Start */
async function loadParticipants(quiet) {
  const st = document.getElementById('status');
  try {
    const rows = await db.list();
    part.clear(); rows.forEach(r => part.set(Number(r.egaid), r.hinweis || ''));
    loaded = true; st.className = 'status';
    st.textContent = DEMO ? 'Demo-Modus: Keine Datenbank verbunden. Änderungen bleiben in diesem Browser.' : '';
  } catch (e) {
    if (!quiet) { st.textContent = 'Häuser konnten nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.'; st.className = 'status err'; }
    if (!loaded) { document.getElementById('summary').textContent = 'Häuser konnten nicht geladen werden.'; document.getElementById('pill-sub').textContent = 'Keine Verbindung'; }
  }
  renderAll(); refreshPopup();
}
async function loadSettings() {
  try { const s = await db.settings(); if (typeof s.zeitraum === 'string') zeitraum = s.zeitraum; if (typeof s.titel === 'string' && s.titel) titel = s.titel; } catch (e) { /* ältere Datenbank ohne Einstellungen: Text aus config.js */ }
  renderWhen();
}
fitQuartier(); updateArrow(); updateStreetLabels(); updateZoomClasses();
map.on('rotate zoomend moveend', updateStreetLabels);
map.on('zoomend', updateZoomClasses);
document.getElementById('list').open = true;
renderAdmin();
loadParticipants(); loadSettings();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isAdmin()) loadParticipants(true); });
</script>
